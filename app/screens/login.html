{% extends "base.html" %}
{% block title %}Sign in — SmartReco{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-[400px]">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-udemy-text">Log in to your account</h1>
      <p class="text-gray-500 mt-2">Learn on your own time from top courses.</p>
    </div>

    <div class="bg-white border border-udemy-border rounded-lg p-8 shadow-sm">
      <div id="error" class="hidden mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded px-4 py-3"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-udemy-text mb-1">Email</label>
          <input id="email" type="email" class="w-full border border-udemy-border px-4 py-3 text-sm focus:outline-none focus:border-udemy-text transition" placeholder="you@example.com" />
        </div>
        <div>
          <label class="block text-sm font-bold text-udemy-text mb-1">Password</label>
          <input id="password" type="password" class="w-full border border-udemy-border px-4 py-3 text-sm focus:outline-none focus:border-udemy-text transition" placeholder="••••••••" />
        </div>

        <button onclick="signIn()" class="w-full py-3 bg-udemy-purple text-white font-bold text-base hover:bg-udemy-hover transition">
          Log in
        </button>
        <button onclick="signUp()" class="w-full py-3 border border-udemy-text text-udemy-text font-bold text-base hover:bg-gray-50 transition">
          Sign up
        </button>
      </div>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function showError(msg) {
    const e = document.getElementById("error");
    e.textContent = msg; e.classList.remove("hidden");
  }
  async function signIn() {
    const body = new URLSearchParams({
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    });
    const r = await fetch("/api/auth/login", { method: "POST", body });
    if (r.ok) location.href = "/"; else showError("Invalid credentials.");
  }
  async function signUp() {
    const r = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    if (r.ok) location.href = "/";
    else showError((await r.json()).detail || "Registration failed.");
  }
</script>
{% endblock %}
